server:
  port: ${APP_SERVER_PORT:8080}

spring:
  application:
    name: ecommerce-hub
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce_hub_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: HubHikariPool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: hub
      hibernate.format_sql: true

  flyway:
    enabled: true
    # Single Flyway chain for both the task engine's own migrations (V1-V5, unqualified
    # table names, e.g. "CREATE TABLE gorevler") and ours (V1000+, always schema-qualified,
    # e.g. "CREATE TABLE hub.organization"). One shared history table, one migration run —
    # see plan §1.4. default-schema must stay "motor" because only the engine's migrations
    # rely on it to resolve unqualified table names; ours never do.
    locations: classpath:db/motor-migration,classpath:db/migration/hub
    schemas: motor,hub
    default-schema: motor
    table: flyway_schema_history

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

hub:
  dispatcher:
    # A second pool, authenticated as hub_system (BYPASSRLS) — never hub_app, never
    # the primary pool's superuser dev default. See SystemDataSourceConfig.
    system-datasource:
      url: ${spring.datasource.url}
      username: hub_system
      password: ${HUB_SYSTEM_DB_PASSWORD:hub_system_pass}
      driver-class-name: org.postgresql.Driver
    per-org-per-cycle: 5
    total-per-cycle: 50
    channel-concurrency-limit: 5
    orphan-timeout-multiplier: 3
    processing-timeout-seconds: 120
    cycle-period-ms: 1000
    sweep-period-ms: 5000

  push:
    # plan §3: the coalescing window. Every pending row for a connection goes out in
    # one batch call per window, so this is the upper bound on push latency, not a
    # throughput knob — plan §5 allows < 60s at peak, so 5s has plenty of headroom.
    window-ms: 5000
    window-batch-limit: 1000

  reconcile:
    sweep-period-ms: 30000
    intent-sweep-period-ms: 60000
    # plan §11 row 2 — hourly. Returns are not time-critical the way stock is, and each
    # pass costs a channel call per connection.
    return-sweep-period-ms: 3600000
    # plan §11's nightly pass. Runs after the retention job (02:30) so it never
    # reports a discrepancy against rows that job is in the middle of removing.
    nightly-cron: "0 0 3 * * *"

  channel:
    circuit-failure-threshold: 5
    circuit-open-seconds: 60

  auth:
    # Dev/test-only default — production MUST override. Anyone holding this can mint a
    # token for any user in any organization.
    jwt-secret: ${HUB_JWT_SECRET:dev-only-hub-jwt-secret-change-me-in-production-0123456789}
    access-token-ttl: PT15M
    refresh-token-ttl: P14D
    invitation-ttl: P7D
    password-reset-ttl: PT2H

  returns:
    # plan §0: 24h reminder, 48h timeout + escalation. The timeout never auto-rejects.
    reminder-after: PT24H
    timeout-after: PT48H
    sweep-period-ms: 60000

  retention:
    motor-task-retention-days-default: 30
    raw-event-retention-days: 90
    raw-event-partitions-ahead-months: 2
    cron: "0 30 2 * * *"

  security:
    # Dev/test-only default key — production MUST override via env, never rely on this.
    current-key-version: ${HUB_CREDENTIAL_KEY_VERSION:1}
    credential-keys:
      1: ${HUB_CREDENTIAL_KEY_V1:frIZ4jFakfx2Wx7dSMuRUJkR0JGwhynIrnKtqPfRnd8=}
