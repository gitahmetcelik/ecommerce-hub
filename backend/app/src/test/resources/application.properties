# Test-only overrides. Loaded alongside (not instead of) application.yml — .properties
# wins on conflicting keys, so this file only needs to state what differs.
#
# WHY ALL SCHEDULED WORK IS OFF IN TESTS
#
# Every @SpringBootTest class with a distinct property set gets its own application
# context, and Spring caches those contexts for the whole JVM rather than closing them.
# They all share the one Postgres container, and — because this machine runs the
# docker-compose RabbitMQ — they also all share one live task engine, consumers
# included. Every one of our sweeps is deliberately cross-organization (hub_system,
# BYPASSRLS), so a timer still running in a context created by an earlier test class
# happily picks up rows a completely different test class just wrote, and any context's
# consumer may be the one that executes the resulting task.
#
# That is not hypothetical. It showed up twice: DispatcherGateTests' orphan sweeper
# counted push-send rows produced by BackfillGateTests' context, and Faz4GateTests'
# "one batch call" assertion saw an extra call made by another context's push handler
# against its mock-pazaryeri container.
#
# A long period is NOT enough to prevent this: @Scheduled(fixedDelay...) always fires
# once at startup no matter how large the delay, and that single fire is all it takes.
# Hence an explicit switch rather than a big number.
#
# Nothing here weakens what is under test — every gate test drives the component it is
# testing by calling it directly, which is also what makes those tests deterministic.
hub.scheduling.enabled=false
